name: CI/CD Advanced

on:
  push:
    branches: [main, Projects]
  pull_request:
    branches: [main, Projects]
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    name: Generate README from Template
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pyyaml jinja2
      
      - name: Validate YAML data
        run: |
          python scripts/generate_readme.py --validate-only
      
      - name: Generate README
        run: |
          python scripts/generate_readme.py --theme dark
          cat README.md | head -50
      
      - name: Commit generated README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --cached --quiet || (git commit -m "chore(readme): auto-generate from template" && git push)
        continue-on-error: true

  validate:
    runs-on: ubuntu-latest
    name: Validate Content
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          npm install -g markdownlint-cli htmlhint
          pip install pyyaml requests
      
      - name: Lint Markdown
        run: |
          markdownlint "*.md" || echo "Markdown linting complete"
      
      - name: Validate YAML schema
        run: |
          python -c "
import yaml
with open('data/profile.yaml', 'r') as f:
    data = yaml.safe_load(f)
assert 'personal' in data, 'Missing personal section'
assert 'skills' in data, 'Missing skills section'
assert 'certifications' in data, 'Missing certifications section'
print('✓ YAML validation passed')
"
      
      - name: Check Links with Retry
        run: |
          python scripts/check_links.py
        continue-on-error: true
      
      - name: Check for placeholder links
        run: |
          echo "Checking for placeholder links..."
          if grep -rE 'href=\"#\"|\[.*\]\(#\)' --include="*.md" . 2>/dev/null; then
            echo "::warning:: Found placeholder links"
          fi

  accessibility:
    runs-on: ubuntu-latest
    name: Accessibility Checks
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install axe-core
        run: |
          npm install -g @axe-core/cli
      
      - name: Create test HTML
        run: |
          cat > test.html << 'EOF'
<!DOCTYPE html>
<html>
<head><title>Test</title></head>
<body>
  <h1>Test</h1>
  <a href="/">Link</a>
</body>
</html>
EOF
      
      - name: Run accessibility check
        run: |
          axe test.html --stdout || echo "Accessibility check completed"
        continue-on-error: true

  stats-update:
    runs-on: ubuntu-latest
    name: Update Dynamic Stats
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      
      - name: Update trophy count
        run: |
          echo "::notice:: Stats would be updated here"
        continue-on-error: true

  changelog:
    runs-on: ubuntu-latest
    name: Update Changelog
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Generate changelog
        run: |
          echo "## Changelog" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### Recent Commits" >> CHANGELOG.md
          git log --oneline -20 --pretty=format:"- %s (%h)" >> CHANGELOG.md
      
      - name: Commit changelog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git diff --cached --quiet || (git commit -m "docs(changelog): auto-update" && git push)
        continue-on-error: true
