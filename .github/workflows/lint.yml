name: Lint and Validate

on:
  push:
    branches: [Projects, main]
  pull_request:
    branches: [Projects, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install linting tools
        run: npm install -g markdownlint-cli htmlhint
      
      - name: Lint Markdown
        run: markdownlint *.md 2>/dev/null || echo "Markdown lint completed with warnings"
      
      - name: Lint HTML
        run: htmlhint *.html 2>/dev/null || echo "No HTML files or linting skipped"
      
      - name: Check for placeholder links
        run: |
          echo "Checking for placeholder links (#)..."
          if grep -r 'href="#"' --include="*.md" --include="*.html" .; then
            echo "Warning: Found placeholder links that should be updated"
          fi
